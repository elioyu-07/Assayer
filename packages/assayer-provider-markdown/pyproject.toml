[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assayer-provider-markdown"
version = "0.1.0"
description = "The Assayer Markdown navigation capability provider"
requires-python = ">=3.11"
dependencies = ["assayer-plugin-sdk==0.1.2"]

[project.entry-points."assayer.providers"]
markdown = "assayer_document_navigation:markdown_registration"

[tool.setuptools]
package-dir = { "" = "../../src" }
packages = ["assayer_document_navigation"]
