[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assayer-platform"
version = "0.1.2"
description = "The Assayer platform kernel, Host runtime, and governance gates"
requires-python = ">=3.11"
dependencies = ["assayer-plugin-sdk==0.1.2", "jsonschema==4.26.0"]

[project.optional-dependencies]
mcp = ["mcp==1.27.0"]

[project.scripts]
assayer-json = "assayer_host.transport:main"
assayer-mcp = "assayer_host.transport:mcp_main"
assayer = "assayer_host.cli:main"
assayer-provider-check = "assayer_platform.provider_conformance:main"
assayer-provider-package-check = "assayer_platform.provider_package_conformance:main"
assayer-provider-install-check = "assayer_platform.provider_installation_conformance:main"

[tool.setuptools]
package-dir = { "" = "../../src" }
packages = ["assayer_platform", "assayer_host"]

[tool.setuptools.data-files]
"share/assayer/schemas" = ["../../schemas/*.json"]
