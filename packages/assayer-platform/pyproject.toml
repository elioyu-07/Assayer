[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assayer-platform"
version = "0.1.2"
description = "The Assayer platform kernel, Host runtime, and governance gates"
requires-python = ">=3.11"
dependencies = ["assayer-plugin-sdk>=0.1.2,<0.2.0", "jsonschema==4.26.0"]

[project.optional-dependencies]
browser = ["playwright==1.62.0"]
mcp = ["mcp==1.27.0"]

[project.scripts]
assayer-harness = "assayer_host.harness:main"
assayer-json = "assayer_host.transport:main"
assayer-mcp = "assayer_host.transport:mcp_main"
assayer = "assayer_host.cli:main"
assayer-plugin-check = "assayer_platform.conformance:main"
assayer-plugin-package-check = "assayer_platform.package_conformance:main"
assayer-plugin-install-check = "assayer_platform.installation_conformance:main"
assayer-plugin-release-check = "assayer_platform.release_conformance:main"
assayer-plugin-surface-check = "assayer_platform.surface_conformance:main"
assayer-provider-check = "assayer_platform.provider_conformance:main"
assayer-provider-package-check = "assayer_platform.provider_package_conformance:main"
assayer-provider-install-check = "assayer_platform.provider_installation_conformance:main"

[tool.setuptools]
package-dir = { "" = "../../src" }
packages = ["assayer_platform", "assayer_host", "assayer_agent"]

[tool.setuptools.data-files]
"share/assayer/schemas" = ["../../schemas/*.json"]
"share/assayer/schemas/protocol" = ["../../schemas/protocol/*.json"]
"share/assayer/rules" = ["../../rules/*.md", "../../rules/registry.json"]
