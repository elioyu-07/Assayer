[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assayer-plugin-frontend-audit"
version = "0.1.0"
description = "The Assayer frontend-audit domain plugin"
requires-python = ">=3.11"
dependencies = ["assayer-plugin-sdk>=0.1.2,<0.2.0"]

[project.entry-points."assayer.plugins"]
"assayer.frontend-audit" = "assayer_frontend_audit:registration"

[tool.setuptools]
package-dir = { "" = "../../src" }
packages = ["assayer_frontend_audit"]

[tool.setuptools.package-data]
assayer_frontend_audit = ["manifest.json", "semantic-review.md"]
