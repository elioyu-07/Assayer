[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assayer-agent"
version = "0.1.2"
description = "The model-independent Assayer Agent orchestration loop"
requires-python = ">=3.11"
dependencies = ["assayer-plugin-sdk==0.1.2"]

[tool.setuptools]
package-dir = { "" = "../../src" }
packages = ["assayer_agent"]
