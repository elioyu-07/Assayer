[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assayer"
version = "0.1.0"
description = "Protocol and operation core for Assayer Host"
requires-python = ">=3.11"
dependencies = ["jsonschema==4.26.0"]

[project.optional-dependencies]
browser = ["playwright==1.62.0"]
mcp = ["mcp==1.27.0"]
test = [
  "playwright==1.62.0",
  "mcp==1.27.0",
]

[project.scripts]
assayer-harness = "assayer_host.harness:main"
assayer-json = "assayer_host.transport:main"
assayer-mcp = "assayer_host.transport:mcp_main"
assayer = "assayer_host.cli:main"

[tool.setuptools.data-files]
"share/assayer/schemas" = ["schemas/*.json"]
"share/assayer/schemas/protocol" = ["schemas/protocol/*.json"]
"share/assayer/rules" = ["rules/*.md", "rules/registry.json"]

[tool.setuptools.package-data]
"assayer_platform.builtin_plugins.config_quality" = ["manifest.json"]
"assayer_platform.builtin_plugins.frontend_audit" = ["manifest.json"]
"assayer_platform.builtin_plugins.spec_quality" = ["manifest.json", "recognition.json", "policy.json", "checklist.json", "authority.md", "self-check-checklist.md", "spec-template.md", "nfr-catalog.md", "*.md", "*.schema.json"]
