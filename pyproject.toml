[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assayer"
version = "0.1.0"
description = "Protocol and operation core for Assayer Host"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.18"]

[project.optional-dependencies]
browser = ["playwright>=1.46,<2"]
mcp = ["mcp>=1.0,<2"]

[project.scripts]
assayer-harness = "assayer_host.harness:main"
assayer-json = "assayer_host.transport:main"
assayer-mcp = "assayer_host.transport:mcp_main"
assayer = "assayer_host.cli:main"
