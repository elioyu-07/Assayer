[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-f-host"
version = "0.1.0"
description = "Protocol and operation core for agent-f Host"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.18"]

[project.optional-dependencies]
browser = ["playwright>=1.46,<2"]
mcp = ["mcp>=1.0,<2"]

[project.scripts]
agent-f-harness = "agent_f_host.harness:main"
agent-f-json = "agent_f_host.transport:main"
agent-f-mcp = "agent_f_host.transport:mcp_main"
